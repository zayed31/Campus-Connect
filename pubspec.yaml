name: campus_connect
description: "A Social Media Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.3.4
  firebase_messaging: ^15.1.6
  image_picker: ^1.1.2
  shared_preferences: ^2.1.0
  permission_handler: ^10.0.0 
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  crypto: ^3.0.0
  url_launcher: ^6.0.0
  flutter_plugin_android_lifecycle: ^2.0.23

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Jaro
      fonts:
        - asset: fonts/Jaro_9pt-Regular.ttf
